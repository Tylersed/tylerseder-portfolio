<!doctype html>
<html lang="en" data-theme="nova">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f0f8">
  <title>Page not found — Tyler Seder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f0f8;--surface:#fffafd;--ink:#211529;--muted:#6e5b73;--accent:#7c3aed;--line:rgba(33,21,41,.13)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:55px 55px}.box{width:min(850px,100%);padding:clamp(30px,7vw,90px);border:1px solid var(--line);border-radius:30px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 28px 90px rgba(49,39,27,.14);backdrop-filter:blur(12px)}small{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;letter-spacing:.14em}h1{margin:.18em 0;font-size:clamp(4.5rem,14vw,11rem);line-height:.82;letter-spacing:-.08em}p{max-width:520px;color:var(--muted);font-size:17px}a{display:inline-flex;align-items:center;gap:32px;margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-family:"IBM Plex Mono",monospace;font-size:9px;text-decoration:none;text-transform:uppercase;letter-spacing:.08em}a:hover{transform:translateY(-3px)}
  </style>
</head>
<body><main class="box"><small>404 / Route not found</small><h1>Page<br>not found.</h1><p>The page you requested is not part of this portfolio system.</p><a href="/">Return to tylerseder.com <span>→</span></a></main></body>
</html>
